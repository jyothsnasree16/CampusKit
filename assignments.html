<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments | CampusKit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #08b6d9, #1769aa);
            color: white;
            padding: 30px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top h1 {
            font-size: 30px;
        }

        .home-btn {
            text-decoration: none;
            background: white;
            color: #1769aa;
            padding: 12px 22px;
            border-radius: 25px;
            font-weight: bold;
        }

        .intro {
            text-align: center;
            margin-bottom: 25px;
        }

        .intro h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .intro p {
            opacity: 0.9;
        }

        .card {
            background: rgba(255,255,255,0.22);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .input-box {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .add-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #ffe58a;
            color: #17324d;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .assignments {
            margin-top: 25px;
        }

        .assignments h3 {
            margin-bottom: 15px;
            font-size: 21px;
        }

        .assignment {
            background: rgba(255,255,255,0.92);
            color: #17324d;
            padding: 18px;
            border-radius: 17px;
            margin-bottom: 14px;
            position: relative;
        }

        .assignment h4 {
            font-size: 19px;
            margin-bottom: 8px;
        }

        .assignment p {
            margin: 5px 0;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff0c2;
            color: #996500;
        }

        .completed {
            background: #d7f8df;
            color: #16833a;
        }

        .overdue {
            background: #ffdada;
            color: #c62828;
        }

        .complete-btn {
            margin-top: 12px;
            padding: 9px 15px;
            border: none;
            border-radius: 10px;
            background: #1769aa;
            color: white;
            cursor: pointer;
        }

        .delete-btn {
            margin-top: 12px;
            margin-left: 8px;
            padding: 9px 15px;
            border: none;
            border-radius: 10px;
            background: #e85d75;
            color: white;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 25px;
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>🎓 CampusKit</h1>
        <a href="index.html" class="home-btn">Home</a>
    </div>

    <div class="intro">
        <h2>📝 Assignments</h2>
        <p>Keep track of your assignments and never miss a submission.</p>
    </div>

    <div class="card">

        <div class="input-box">
            <label>📚 Subject</label>
            <select id="subject">
                <option value="">Select Subject</option>
                <option>Java</option>
                <option>Python</option>
                <option>Data Structures</option>
                <option>DMGT</option>
                <option>DLCO</option>
            </select>
        </div>

        <div class="input-box">
            <label>📝 Assignment Name</label>
            <input type="text" id="assignmentName"
                   placeholder="Example: Java Inheritance Program">
        </div>

        <div class="input-box">
            <label>📅 Due Date</label>
            <input type="date" id="dueDate">
        </div>

        <button class="add-btn" onclick="addAssignment()">
            ➕ Add Assignment
        </button>

        <div class="assignments">
            <h3>📋 My Assignments</h3>
            <div id="assignmentList">
                <div class="empty">
                    No assignments added yet.
                </div>
            </div>
        </div>

    </div>

</div>

<script>

let assignments = JSON.parse(localStorage.getItem("campusAssignments")) || [];
function addAssignment() {

    const subject = document.getElementById("subject").value;
    const name = document.getElementById("assignmentName").value.trim();
    const dueDate = document.getElementById("dueDate").value;

    if (subject === "" || name === "" || dueDate === "") {
        alert("Please fill in all the assignment details.");
        return;
    }

    assignments.push({
        subject: subject,
        name: name,
        dueDate: dueDate,
        completed: false
    });
    localStorage.setItem("campusAssignments", JSON.stringify(assignments));

    document.getElementById("subject").value = "";
    document.getElementById("assignmentName").value = "";
    document.getElementById("dueDate").value = "";

    displayAssignments();
}

function displayAssignments() {

    const list = document.getElementById("assignmentList");

    if (assignments.length === 0) {
        list.innerHTML = `
            <div class="empty">
                No assignments added yet.
            </div>
        `;
        return;
    }

    list.innerHTML = "";

    assignments.forEach((assignment, index) => {

        let today = new Date();
        today.setHours(0, 0, 0, 0);

        let due = new Date(assignment.dueDate);
        due.setHours(0, 0, 0, 0);

        let statusText;
        let statusClass;

        if (assignment.completed) {
            statusText = "✓ Completed";
            statusClass = "completed";
        } 
        else if (due < today) {
            statusText = "⚠ Overdue";
            statusClass = "overdue";
        } 
        else {
            statusText = "⏳ Pending";
            statusClass = "pending";
        }

        list.innerHTML += `
            <div class="assignment">

                <h4>${assignment.name}</h4>

                <p>📚 <b>Subject:</b> ${assignment.subject}</p>

                <p>📅 <b>Due:</b> ${formatDate(assignment.dueDate)}</p>

                <span class="status ${statusClass}">
                    ${statusText}
                </span>

                ${
                    !assignment.completed
                    ? `<br>
                       <button class="complete-btn"
                       onclick="completeAssignment(${index})">
                       ✓ Mark Completed
                       </button>`
                    : ""
                }

                <button class="delete-btn"
                onclick="deleteAssignment(${index})">
                🗑 Delete
                </button>

            </div>
        `;
    });
}

function completeAssignment(index) {

assignments[index].completed = true;

localStorage.setItem("campusAssignments", JSON.stringify(assignments));

displayAssignments();
}

function deleteAssignment(index) {

assignments.splice(index, 1);

localStorage.setItem("campusAssignments", JSON.stringify(assignments));

displayAssignments();
}

function formatDate(date) {

    const parts = date.split("-");

    return parts[2] + "/" + parts[1] + "/" + parts[0];
}
displayAssignments();
</script>

</body>
</html>
