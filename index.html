<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusKit - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #4facfe, #7367f0, #9b59b6);
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            color: #087ea4;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #dceef5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00a8d6;
        }

        .create-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #00a8d6, #087ea4);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            min-height: 20px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .login-link a {
            color: #087ea4;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        CampusKit 🎓
    </div>

    <div class="subtitle">
        Create Your Account
    </div>

    <form id="signupForm">

        <div class="group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >
        </div>

        <div class="group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Create your username"
                required
            >
        </div>

        <div class="group">
            <label for="password">Create Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create your password"
                required
            >
        </div>

        <div class="group">
            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >
        </div>

        <button type="submit" class="create-btn">
            📝 Create Account
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if (password !== confirmPassword) {

        message.style.color = "red";

        message.textContent =
            "❌ Passwords do not match.";

        return;
    }


    if (password.length < 4) {

        message.style.color = "red";

        message.textContent =
            "❌ Password must contain at least 4 characters.";

        return;
    }


    localStorage.setItem(
        "campuskitEmail",
        email
    );

    localStorage.setItem(
        "campuskitUsername",
        username
    );

    localStorage.setItem(
        "campuskitPassword",
        password
    );


    message.style.color = "green";

    message.textContent =
        "✅ Account created successfully!";


    setTimeout(function() {

        window.location.href = "login.html";

    }, 1000);

});

</script>

</body>
</html>
