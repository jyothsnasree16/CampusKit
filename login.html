<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusKit - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #4facfe, #7367f0, #9b59b6);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            color: #087ea4;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 2px solid #dceef5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #f8fcff;
        }

        input:focus,
        select:focus {
            border-color: #00a8d6;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #087ea4;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #00a8d6, #087ea4);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .signup-link a {
            color: #087ea4;
            font-weight: bold;
            text-decoration: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        CampusKit 🎓
    </div>

    <div class="subtitle">
        Student Login
    </div>

    <form id="loginForm">

        <div class="input-group">
            <label for="rollNumber">Roll Number</label>

            <input
                type="text"
                id="rollNumber"
                placeholder="Enter your roll number"
                required
            >
        </div>

        <div class="input-group">
            <label for="branch">Branch</label>

            <select id="branch" required>

                <option value="">
                    Select your branch
                </option>

                <option value="IT">
                    Information Technology (IT)
                </option>

                <option value="CSE">
                    Computer Science & Engineering (CSE)
                </option>

                <option value="ECE">
                    Electronics & Communication (ECE)
                </option>

                <option value="EEE">
                    Electrical & Electronics (EEE)
                </option>

                <option value="MECH">
                    Mechanical Engineering
                </option>

                <option value="CIVIL">
                    Civil Engineering
                </option>

                <option value="AIML">
                    Artificial Intelligence & Machine Learning
                </option>

                <option value="DS">
                    Data Science (DS)
                </option>

            </select>
        </div>

        <div class="input-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                    id="showButton"
                >
                    Show
                </button>

            </div>

        </div>

        <button
            type="submit"
            class="login-btn"
        >
            🔐 Login
        </button>

        <div
            class="message"
            id="message"
        ></div>

    </form>

    <div class="signup-link">

        Don't have an account?

        <a href="index.html">
            Create Account
        </a>

    </div>

    <div class="footer">
        Made with ❤️ for students | CampusKit
    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.getElementById("showButton");

    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

    } else {

        password.type = "password";
        button.textContent = "Show";

    }
}


document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const rollNumber =
        document.getElementById("rollNumber").value.trim();

    const branch =
        document.getElementById("branch").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    const savedPassword =
        localStorage.getItem("campuskitPassword");


    /* Check whether an account has been created */

    if (!savedPassword) {

        message.style.color = "red";

        message.textContent =
            "❌ Please create an account first.";

        return;
    }


    /* Password must exactly match signup password */

    if (password !== savedPassword) {

        message.style.color = "red";

        message.textContent =
            "❌ Incorrect password.";

        return;
    }


    /* Save login status */

    localStorage.setItem(
        "campuskitLoggedIn",
        "true"
    );

    localStorage.setItem(
        "campuskitRollNumber",
        rollNumber
    );

    localStorage.setItem(
        "campuskitBranch",
        branch
    );


    message.style.color = "green";

    message.textContent =
        "✅ Login successful!";


    /* Open dashboard */

    setTimeout(function() {

        window.location.href = "dashboard.html";

    }, 700);

});

</script>

</body>
</html>
