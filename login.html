<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusKit - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00c6ff);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            color: #087ea4;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 2px solid #dceef5;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #f8fcff;
        }

        input:focus,
        select:focus {
            border-color: #00a8d6;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #087ea4;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 6px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #00a8d6, #087ea4);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #eefaff;
            border-radius: 12px;
            color: #555;
            font-size: 12px;
            text-align: center;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            CampusKit 🎓
        </div>

        <div class="subtitle">
            Student Campus Management System
        </div>


        <form id="loginForm">


            <!-- Roll Number -->

            <div class="input-group">

                <label for="rollNumber">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Enter your roll number"
                    required
                >

                <div class="hint">
                    Example: 25B01A1201
                </div>

            </div>


            <!-- Branch -->

            <div class="input-group">

                <label for="branch">
                    Branch
                </label>

                <select id="branch" required>

                    <option value="">
                        Select your branch
                    </option>

                    <option value="IT">
                        Information Technology (IT)
                    </option>

                    <option value="CSE">
                        Computer Science & Engineering (CSE)
                    </option>

                    <option value="ECE">
                        Electronics & Communication (ECE)
                    </option>

                    <option value="EEE">
                        Electrical & Electronics (EEE)
                    </option>

                    <option value="MECH">
                        Mechanical Engineering
                    </option>

                    <option value="CIVIL">
                        Civil Engineering
                    </option>

                    <option value="AIML">
                        Artificial Intelligence & Machine Learning
                    </option>

                    <option value="DS">
                        Data Science (DS)
                    </option>

                </select>

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password (1234)"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                        id="showButton"
                    >
                        Show
                    </button>

                </div>

                <div class="hint">
                    Password: 1234
                </div>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn"
            >
                🔐 Login
            </button>


            <div
                class="message"
                id="message"
            ></div>


        </form>


        <div class="info">

            <b>CampusKit</b><br>

            Enter your roll number, select your branch
            and enter your password to continue.

        </div>


        <div class="footer">

            Made with ❤️ for students | CampusKit

        </div>


    </div>


    <script>


        // Show / Hide Password

        function togglePassword() {

            const password =
                document.getElementById("password");

            const showButton =
                document.getElementById("showButton");


            if (password.type === "password") {

                password.type = "text";

                showButton.textContent = "Hide";

            }

            else {

                password.type = "password";

                showButton.textContent = "Show";

            }

        }



        // Login

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {


                event.preventDefault();


                const rollNumber =
                    document
                    .getElementById("rollNumber")
                    .value
                    .trim();


                const branch =
                    document
                    .getElementById("branch")
                    .value;


                const password =
                    document
                    .getElementById("password")
                    .value;


                const message =
                    document
                    .getElementById("message");



                // Check Roll Number

                if (rollNumber === "") {

                    message.style.color = "red";

                    message.textContent =
                        "❌ Please enter your roll number.";

                    return;

                }



                // Check Branch

                if (branch === "") {

                    message.style.color = "red";

                    message.textContent =
                        "❌ Please select your branch.";

                    return;

                }



                // Password must be 1234

                if (password !== "1234") {

                    message.style.color = "red";

                    message.textContent =
                        "❌ Incorrect password. Please enter 1234.";

                    return;

                }



                // Successful Login

                message.style.color = "green";

                message.textContent =
                    "✅ Login successful!";



                // Save student information

                localStorage.setItem(
                    "campuskitRollNumber",
                    rollNumber
                );

                localStorage.setItem(
                    "campuskitBranch",
                    branch
                );



                // Open existing home page

                setTimeout(function() {

                    window.location.href = "index.html";

                }, 700);


            });

    </script>

</body>

</html>
